name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, dev]
  pull_request:
    branches: [main]
  release:
    types: [published]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      publish_test:
        description: "Publish the package to TestPyPI"
        type: boolean
        required: false
        default: false
      publish_prod:
        description: "Publish the package to PyPI"
        type: boolean
        required: false
        default: false
      publish_docker:
        description: "Build and push the Docker image"
        type: boolean
        required: false
        default: false

env:
  PYTHON_VERSION: "3.11"

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
      
      - name: Verify installation
        run: |
          python -c "import xcopilot; print('xcopilot imported successfully')"
      
      - name: Run tests
        run: |
          pytest tests/ -v --tb=short
      
      - name: Check coverage
        run: |
          pytest tests/ --cov=src/xcopilot --cov-report=xml --cov-fail-under=65

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
      
      - name: Run ruff
        run: |
          ruff check src/ tests/
      
      - name: Run mypy
        run: |
          mypy src/
      
      - name: Check formatting
        run: |
          ruff format --check src/ tests/

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      
      - name: Install build dependencies
        run: |
          pip install build
      
      - name: Build package
        run: |
          python -m build
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish-test:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    needs: build
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_test)
    environment:
      name: testpypi
      url: https://test.pypi.org/p/x-copilot/
    steps:
      - uses: actions/checkout@v4
      
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          user: __token__
          password: ${{ secrets.TEST_PYPI_TOKEN }}

  publish-prod:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    if: >-
      (github.event_name == 'release' && github.event.action == 'published') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_prod)
    environment:
      name: pypi
      url: https://pypi.org/p/x-copilot/
    steps:
      - uses: actions/checkout@v4
      
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_TOKEN }}

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build
    if: >-
      (github.event_name == 'release' && github.event.action == 'published') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_docker)
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: tnvmac/x-copilot
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  auto-update:
    name: Check for Updates
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Check for dependency updates
        run: |
          pip install pip-tools
          pip-compile --upgrade --all-extras --output-file requirements.txt pyproject.toml
      
      - name: Create PR for updates
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: auto/dependency-updates
          title: "chore: dependency updates"
          body: |
            Automated dependency updates from scheduled workflow.
          commit-message: "chore: update dependencies"

  notify:
    name: Notify on Release
    runs-on: ubuntu-latest
    needs: [publish-prod, docker]
    if: >-
      always() &&
      ((github.event_name == 'release' && github.event.action == 'published') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_prod && inputs.publish_docker))
    steps:
      - name: Send notification
        run: |
          echo "Release ${{ github.event.release.tag_name }} published successfully!"
          echo "PyPI: https://pypi.org/project/x-copilot/${{ github.event.release.tag_name }}/"
          echo "Docker: https://hub.docker.com/r/tnvmac/x-copilot"