name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # Python tests and linting
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: Run ruff linting
        run: ruff check src/ tests/
      
      - name: Run mypy type checking
        run: mypy src/
      
      - name: Run pytest
        run: pytest tests/ -v --tb=short --cov=src/xcopilot --cov-fail-under=65

  # WebApp tests and build
  webapp-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: webapp/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run TypeScript check
        run: npx tsc --noEmit
      
      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  # Desktop app build (requires Rust)
    desktop-build:
      runs-on: windows-latest
      defaults:
        run:
          working-directory: desktop
      steps:
        - uses: actions/checkout@v4
      
        - name: Set up Node.js
          uses: actions/setup-node@v4
          with:
            node-version: ${{ env.NODE_VERSION }}
            cache: 'npm'
            cache-dependency-path: desktop/package-lock.json
      
        - name: Install Rust
          uses: actions-rs/toolchain@v1
          with:
            toolchain: stable
            profile: minimal
            override: true
      
        - name: Cache Rust dependencies
          uses: actions/cache@v4
          with:
            path: |
              ~/.cargo/bin
              ~/.cargo/registry/index
              ~/.cargo/registry/cache
              ~/.cargo/git/db
              desktop/src-tauri/target
            key: ${{ runner.os }}-cargo-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
      
        - name: Install frontend dependencies
          run: npm ci
      
        - name: Build Tauri app
          uses: tauri-apps/tauri-action@v0
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
            TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          with:
            tagName: v__VERSION__
            releaseName: 'X-Copilot Desktop v__VERSION__'
            releaseBody: 'See the assets to download this version and install.'
            releaseDraft: true
            prerelease: false
            args: --target x86_64-pc-windows-msvc

    # Windows Installer Build
    windows-installer:
      runs-on: windows-latest
      defaults:
        run:
          working-directory: desktop
      steps:
        - uses: actions/checkout@v4
      
        - name: Set up Node.js
          uses: actions/setup-node@v4
          with:
            node-version: ${{ env.NODE_VERSION }}
            cache: 'npm'
            cache-dependency-path: desktop/package-lock.json
      
        - name: Install Rust
          uses: actions-rs/toolchain@v1
          with:
            toolchain: stable
            profile: minimal
            override: true
      
        - name: Cache Rust dependencies
          uses: actions/cache@v4
          with:
            path: |
              ~/.cargo/bin
              ~/.cargo/registry/index
              ~/.cargo/registry/cache
              ~/.cargo/git/db
              desktop/src-tauri/target
            key: ${{ runner.os }}-cargo-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
      
        - name: Install frontend dependencies
          run: npm ci
      
        - name: Build Tauri app with NSIS installer
          uses: tauri-apps/tauri-action@v0
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          with:
            tagName: v__VERSION__
            releaseName: 'X-Copilot Installer v__VERSION__'
            releaseBody: 'Windows installer (NSIS) for X-Copilot'
            releaseDraft: true
            prerelease: false
            args: --target x86_64-pc-windows-msvc --bundle nsis
      
        - name: Upload installer artifacts
          uses: actions/upload-artifact@v4
          with:
            name: xcopilot-windows-installer
            path: |
              desktop/src-tauri/target/release/bundle/nsis/*.exe
              desktop/src-tauri/target/release/bundle/msi/*.msi
            retention-days: 30

    # Create release
    release:
      needs: [python-tests, webapp-build, desktop-build, windows-installer]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}