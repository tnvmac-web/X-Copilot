[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "x-copilot"
version = "0.1.0"
description = "Self-growing AI agent for Windows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonlines>=4.0",
    "chromadb>=0.5",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "requests>=2.31",
    "rich>=13.7",
    "click>=8.1",
    "openai>=1.30",
    "watchdog>=3.0",
    "networkx>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.4", "mypy>=1.10"]
cli = ["nodeenv>=1.9"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["xcopilot*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
