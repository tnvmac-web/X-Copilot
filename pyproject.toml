[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "x-copilot"
version = "0.1.0"
description = "Self-growing AI agent for Windows with 5-layer memory, auto skill creation, and permission pipeline"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
authors = [
    { name = "tnvmac", email = "tnvmac@web.com" }
]
maintainers = [
    { name = "tnvmac", email = "tnvmac@web.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "jsonlines>=4.0",
    "chromadb>=0.5",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "requests>=2.31",
    "rich>=13.7",
    "click>=8.1",
    "openai>=1.30",
    "tiktoken>=0.7",
    "watchdog>=3.0",
    "networkx>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.4", "mypy>=1.10", "pytest-cov>=4.0"]
cli = ["nodeenv>=1.9"]

[project.entry-points]
console_scripts = { "xcopilot" = "xcopilot.cli.main:cli" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["xcopilot*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
ignore_missing_imports = true
follow_imports = "skip"
disable_error_code = ["var-annotated", "no-any-return", "arg-type", "dict-item", "union-attr", "assignment", "return-value"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
omit = [
    "src/xcopilot/cli/*",
]